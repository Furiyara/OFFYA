name: Android APK oluştur
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kaynak kodunu al
        uses: actions/checkout@v4
      - name: Java kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK kur
        uses: android-actions/setup-android@v3
      - name: SDK bileşenlerini kur
        run: yes | sdkmanager --licenses
      - name: Android platform ve build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Gradle kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: APK derle
        run: gradle assembleDebug
      - name: APK dosyasını paylaşılabilir çıktı olarak kaydet
        uses: actions/upload-artifact@v4
        with:
          name: Turkce-Flick-Klavye-APK
          path: app/build/outputs/apk/debug/app-debug.apk
